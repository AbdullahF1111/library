<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>My Library</h1>
  <div id="library"></div>
  <button id="newBookBtn">New Book</button>

<dialog id="bookDialog">
  <form id="bookForm">
    <label>Title: <input type="text" id="title" required></label>
    <label>Author: <input type="text" id="author" required></label>
    <label>Pages: <input type="number" id="pages" required></label>
    <label>Read:<input type="checkbox" id="isRead"></label>
    <button type="submit">Add Book</button>
  </form>
</dialog>

  <script src="basic.js"></script>
</body>
</html>
